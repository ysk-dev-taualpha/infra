x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gallery:
    build:
      context: /home/yplic/workspace/image-gallery
      dockerfile: .infra_gallery/Dockerfile
    image: image-gallery:latest
    container_name: image-gallery
    ports:
      - "8765:8765"
    volumes:
      - /mnt/data:/mnt/data:ro
      - gallery_data:/app/data
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gallery_data:
