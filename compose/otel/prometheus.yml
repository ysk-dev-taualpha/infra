global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otelcol
    static_configs:
      - targets: ["otelcol:8889"]
  - job_name: otelcol-self
    static_configs:
      - targets: ["otelcol:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
