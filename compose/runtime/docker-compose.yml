x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  runtime:
    build:
      context: /home/yplic/workspace/local-ai-companion
      dockerfile: .infra_runtime/Dockerfile
    image: local-ai-runtime:latest
    container_name: local-ai-runtime
    ports:
      - "8090:8090"
    volumes:
      - ./config.docker.json:/app/config.json:ro
      - runtime_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      whisper:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  whisper:
    build:
      context: /home/yplic/workspace/local-ai-companion
      dockerfile: .infra_runtime/Dockerfile.whisper
    image: local-ai-whisper:latest
    container_name: local-ai-whisper
    runtime: nvidia
    ports:
      - "8093:8093"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  runtime_data:
  whisper_cache:
